# Nginx Reverse Proxy Configuration for Mini Militia WebSocket Game
# Place this at /etc/nginx/sites-available/mini-militia and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _; # Replace with your domain (e.g. game.yourdomain.com) or leave as _ for Public IP

    # Game Web Assets & WebSocket Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers (Crucial for real-time multiplayer)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering for ultra-low latency gaming
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
